<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enter Name - Monster Mind Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="name-container">

        <img src="images/logo.jpeg"
             alt="Monster Mind Quiz Logo"
             class="name-logo">

        <h1>MONSTER MIND</h1>

        <h2>QUIZ</h2>

        <p class="name-subtitle">
            Enter your name to begin the challenge
        </p>


        <div class="name-card">

            <label for="player-name">
                YOUR NAME
            </label>

            <input
                type="text"
                id="player-name"
                placeholder="Enter your full name"
                maxlength="40"
                autocomplete="name"
            >

            <p id="name-error"></p>

            <button onclick="continueToLevels()">
                CONTINUE
            </button>

        </div>

    </div>


    <script>

        function continueToLevels() {

            var nameInput =
                document.getElementById("player-name");

            var playerName =
                nameInput.value.trim();

            var errorMessage =
                document.getElementById("name-error");


            if (playerName === "") {

                errorMessage.textContent =
                    "Please enter your name.";

                return;
            }


            localStorage.setItem(
                "player_name",
                playerName
            );


            window.location.href =
                "levels.html";
        }


        document.getElementById("player-name")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    continueToLevels();

                }

            });

    </script>

</body>

</html>
